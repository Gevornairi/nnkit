[project]
name = "nnkit"
version = "0.2.0"
description = "From-scratch neural network toolkit with hand-written backward passes (MLX/NumPy)"
readme = "README.md"
authors = [
    { name = "Gevorg Khondkaryan", email = "gevorg.khondkaryan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.32.4",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
